<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <!-- CONFIGURAÇÕES DE PWA E ÍCONES PARA O APLICATIVO -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7abaf2">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Para iPhone / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
    <meta name="apple-mobile-web-app-title" content="Presença">
    <link rel="apple-touch-icon" href="icon-192.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Presença Escolar 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"> 
    
    <style>
        /* Estilos base copiados e simplificados */
        :root {
            --c-primary: #7abaf2;
            --c-secondary: #50e3c2;
            --c-success: #28a745;
            --c-bg: #f7f9fc;
            --c-card: #ffffff;
            --c-text: #333;
            --c-text-gray: #777;
            --c-border: #eee;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --c-danger-text: #721c24;
            --c-danger-bg: #dc3545;
            --c-warning-bg: salmon;
            --c-info-bg: lightgreen; 
            --c-input-readonly-bg: #eee;
        }

        /* VARIAVEIS PARA MODO ESCURO */
        html[data-theme="dark"] {
            --c-bg: #1e1e1e;
            --c-card: #2d2d2d;
            --c-text: #f0f0f0;
            --c-text-gray: #bbb;
            --c-border: #444;
            --shadow: 0 4px 15px rgba(0,0,0,0.4);
            --c-primary: #8ab4f8; 
            --c-secondary: #50e3c2; 
            --c-danger-text: #ff9999;
            --c-danger-bg: #cc3333;
            --c-warning-bg: salmon;
            --c-info-bg: lightgreen;
            --c-input-readonly-bg: #3c3c3c; 
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--c-bg);
            color: var(--c-text);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container { max-width: 700px; margin: auto; }
        .card { 
            background-color: var(--c-card); 
            border-radius: 12px; 
            padding: 25px; 
            box-shadow: var(--shadow); 
            margin-bottom: 25px;
            transition: background-color 0.3s, box-shadow 0.3s; 
        }
        h1 { color: var(--c-primary); text-align: center; margin-bottom: 10px; font-size: 2em; }
        h2 { 
            margin-top: 0; 
            color: var(--c-text); 
            border-bottom: 2px solid var(--c-primary); 
            padding-bottom: 10px; 
            display: inline-block; 
        }

        /* Formulário e Combos */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-field { display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-weight: 600; font-size: 0.9em; }
        input[type="text"], input[type="tel"], input[type="date"], select { 
            width: 100%;
            box-sizing: border-box;
            padding: 12px; 
            border: 1px solid #999999; 
            border-radius: 8px; 
            font-size: 1em; 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--c-bg);
            color: var(--c-text);
            transition: background-color 0.3s, border-color 0.3s;
        }
        
        /* ESTILO PARA INPUTS READ-ONLY E TURMAS DESABILITADAS */
        input:read-only { background-color: var(--c-input-readonly-bg); color: var(--c-text); }
        .turma-disabled { background-color: var(--c-input-readonly-bg); color: var(--c-text-gray); cursor: not-allowed; }

        /* Estilo para agrupar Horário e Botão de Salvar */
        .horario-group { display: flex; gap: 10px; align-items: flex-end; }
        .horario-group input { flex-grow: 1; margin-bottom: 0; }
        .horario-group button {
            padding: 12px 15px; font-size: 0.9em; background-color: var(--c-primary);
            color: white; border: none; border-radius: 8px; cursor: pointer;
            font-weight: 600; white-space: nowrap; transition: background-color 0.2s;
        }
        .horario-group button:hover { background-color: #3a75b8; }
        
        /* Tabela de Presença */
        .table-wrapper { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; min-width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05); }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--c-border); text-align: left; background-color: var(--c-card); transition: background-color 0.3s; }
        th { background-color: var(--c-primary); color: #333; font-weight: 700; text-align: center; }
        
        /* --- NOVOS ESTILOS: CAIXAS DE SELEÇÃO E OBSERVAÇÕES --- */
        .check-cell { text-align: center; vertical-align: middle; }
        .check-cell input[type="checkbox"] { transform: scale(1.6); cursor: pointer; margin: 0; }
        .check-presenca { accent-color: lightgreen; }
        .check-ocorrencia { accent-color: salmon; }
        
        .obs-row { display: none; background-color: var(--c-bg); }
        .obs-row.active { display: table-row; }
        .obs-textarea {
            width: 100%; padding: 8px 12px; border: 1px dashed var(--c-primary); border-radius: 6px;
            font-family: 'Poppins', sans-serif; font-size: 0.9em; resize: vertical; min-height: 45px;
            box-sizing: border-box; background-color: var(--c-card); color: var(--c-text);
        }

        /* Estilos de Botões */
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-primary { 
            background-color: var(--c-primary); color: white; padding: 10px; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: #3a75b8; }
        .btn-full-width { width: 100%; margin-top: 10px; font-size: 1em; padding: 12px; }
        
        #presenca-status { margin-top: 15px; color: var(--c-danger-text); text-align: center; font-weight: 600; }   

        /* AJUSTES PARA DISPOSITIVOS MÓVEIS */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .card { padding: 15px; }
            h1 { font-size: 1.5em; margin-top: 10px; margin-bottom: 10px; }
            h2 { margin-top: 15px; }
            .form-grid { grid-template-columns: 1fr 1fr; gap: 10px; } 
            .form-field input[type="text"], .form-field input[type="date"], .form-field select { padding: 10px; }
            .utility-buttons { margin-top: 0; float: none; justify-content: space-between; width: 100%; margin-bottom: 10px; }
            .utility-buttons button { flex-grow: 1; min-width: auto; }
            
            .table-wrapper { overflow-x: hidden; }
            table { width: 100%; }
            th, td { padding: 8px 5px; font-size: 0.8em; white-space: normal; }
            th:nth-child(1), td:nth-child(1) { width: auto; font-size: 0.85em; }
            .check-cell { padding: 8px 5px; }
            .check-cell input[type="checkbox"] { transform: scale(1.4); } 
        }

        @page { size: auto; margin: 8mm; }

/* ESTILOS DE IMPRESSÃO BLOQUEADOS POR DIA */
        @media print {
            body, html { margin: 0 !important; padding: 0 !important; background-color: white !important; }
            
            /* O PULO DO GATO: "display: none" faz o app sumir sem deixar buracos invisíveis */
            .container { display: none !important; }
            
            #tabela-impressao-temp { 
                display: block !important; 
                position: relative !important; 
                width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                background-color: white !important; 
                color: #000 !important;
            }
            .print-day-block { page-break-inside: avoid !important; break-inside: avoid !important; margin-bottom: 12px !important; }
            .print-table-content { width: 100% !important; border-collapse: collapse !important; margin-top: 4px !important; margin-bottom: 6px !important; }
            .print-table-content th { background-color: #f0f0f0 !important; color: #000 !important; font-weight: bold; border: 1px solid #000 !important; padding: 5px 8px !important; text-align: left; }
            .print-table-content td { border: 1px solid #ccc !important; border-top: none !important; border-bottom: none !important; padding: 4px 8px !important; background-color: #fff !important; color: #000 !important; }
            .print-table-content tr:last-child td { border-bottom: 1px solid #000 !important; }
            #tabela-impressao-temp h1 { font-size: 1.3em !important; border-bottom: 2px solid #000 !important; padding-bottom: 4px !important; margin-bottom: 4px !important; color: #000 !important; text-align: center; }
            #tabela-impressao-temp h2 { font-size: 0.9em !important; padding: 0 !important; margin-bottom: 10px !important; text-align: center; font-weight: normal; border-bottom: 1px solid #999 !important; padding-bottom: 3px !important; }
            #tabela-impressao-temp h3 { font-size: 1em !important; margin-top: 6px !important; margin-bottom: 3px !important; font-weight: bold; color: #000 !important; border-bottom: 1px dashed #ccc !important; padding-bottom: 2px !important; }
        }

    </style>
</head>
<body>

<div class="container">
    <h1>📚 Sistema de Registro de Presença 2026</h1>
    <p style="text-align: center; font-weight: 600; margin-top: -5px; margin-bottom: 25px; color: var(--c-primary);">  

    </p>
    
    <div class="card">
       <div class="utility-buttons" style="display: flex; gap: 10px; align-items: center; justify-content: flex-start; margin-bottom: 15px;">
            <button id="toggle-dark-mode" class="btn-primary" title="Modo Claro/Escuro">🌙</button>
            <button id="toggle-settings-btn" class="btn-primary" title="Configurações">⚙️</button>
            <button id="btn-ativar-alarmes" class="btn-primary" title="Ligar/Desligar Alarmes" style="background-color: #e0e0e0; color: #333; border: none;">🔕</button>
            <button id="btn-ver-grade" class="btn-primary" title="Ver Grade de Aulas" style="background-color: #e0e0e0; color: #333; border: none;">📅</button>
        </div>

        <h2>Configurações</h2>
        <div id="settings-panel" style="display: none;">
            <h3>📞 Número de WhatsApp:</h3>
            <div class="form-grid">
                <div class="form-field" style="grid-column: 1 / -1;">
                    <input type="tel" id="setting-whatsapp" placeholder="Ex: 5511987654321 (apenas números)">
                </div>
            </div>
            <div class="button-group">
                <button class="btn-primary" id="save-settings-btn" style="flex-grow: 2;">Salvar Número</button>
            </div>

            <h3 style="margin-top: 25px; border-top: 1px solid var(--c-border); padding-top: 20px;">⏰ Configurar Horários</h3>
            <div class="form-grid">
                <div class="form-field">
                    <label for="setting-colegio">Colégio:</label>
                    <select id="setting-colegio">
                        <option value="">-- Escolha --</option>
                        <option value="Colégio Objetivo">OBJETIVO</option>
                        <option value="Colégio GP">GP</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="setting-turma">Turma:</label>
                    <select id="setting-turma" class="turma-disabled" disabled>
                        <option value="">Selecione Colégio</option>
                    </select>
                </div>
                <div class="form-field" style="grid-column: 1 / -1;">
                    <label for="setting-horario">Horário da Aula:</label>
                    <div class="horario-group">
                        <input type="text" id="setting-horario" placeholder="Ex: 14h00 às 15h30">
                        <button type="button" id="setting-save-horario-btn" class="btn-primary">Salvar Horário</button>
                    </div>
                </div>
            </div>
        </div>
    </div> <!-- Fechamento correto do Card de Configurações -->

    <div class="card" id="presenca-card">
        <h2>Lançamento Diário</h2>
        <form id="formPresenca">
            <div class="form-grid">
                <div class="form-field">
                    <label for="presenca-colegio">Colégio:</label>
                    <select id="presenca-colegio" required>
                        <option value="">-- Mudar Colégio --</option>
                        <option value="Colégio Objetivo" selected>OBJETIVO</option>
                        <option value="Colégio GP">GP</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="presenca-turma">Turma:</label>
                    <select id="presenca-turma" class="turma-disabled" disabled required>
                        <option value="">Selecione um Colégio primeiro</option>
                    </select>
                </div>
                
                <div class="form-field">
                    <label for="presenca-data">Data:</label>
                    <input type="date" id="presenca-data" required>
                </div>
                
                <div class="form-field">
                    <label for="presenca-horario">Horário:</label>
                    <input type="text" id="presenca-horario" readonly>
                </div>
                
                <!-- SELETORES DE EXIBIÇÃO DA TABELA -->
                <div class="form-field" style="grid-column: 1 / -1; margin-top: 10px;">
                    <label>O que registrar hoje?</label>
                    <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 5px;">
                        <label style="cursor: pointer; font-weight: 600;"><input type="checkbox" id="toggle-col-presenca" checked disabled> ✅ Presença</label>
                        <label style="cursor: pointer;"><input type="checkbox" id="toggle-col-apostila"> 📖 Apostila</label>
                        <label style="cursor: pointer;"><input type="checkbox" id="toggle-col-trabalho"> 📄 Trabalho</label>
                        <label style="cursor: pointer;"><input type="checkbox" id="toggle-col-obs"> 💬 Observação</label>
                    </div>
                </div>
            </div>

            <hr>
            <div class="table-wrapper"> 
                <table id="tabela-presenca">
                    <thead>
                        <tr>
                            <th style="width: 50%;">Nome do Aluno</th>
                            <th class="col-presenca" style="text-align: center; cursor: pointer;" title="Marcar/Desmarcar Todos">
                                <button type="button" id="btn-toggle-todos" style="border: none; background: transparent; cursor: pointer; font-size: 1.3em;">✅</button>
                            </th>
                            <th class="col-extra col-apostila" style="display: none; text-align: center;" title="Marcar/Desmarcar Todos - Apostila">
                                <button type="button" id="btn-toggle-apostila" style="border: none; background: transparent; cursor: pointer; font-size: 1.3em;">📖</button>
                            </th>
                            <th class="col-extra col-trabalho" style="display: none; text-align: center;" title="Marcar/Desmarcar Todos - Trabalho">
                                <button type="button" id="btn-toggle-trabalho" style="border: none; background: transparent; cursor: pointer; font-size: 1.3em;">📄</button>
                            </th>
                            <th class="col-extra col-obs" style="display: none; text-align: center; font-size: 1.5em;" title="Adicionar Observação">💬</th>
                        </tr>
                    </thead>
                    <tbody id="listaAlunos">
                        <tr><td colspan="5" style="text-align: center;">Selecione um Colégio e uma Turma para carregar a lista de alunos.</td></tr>
                    </tbody>
                </table>
            </div>
            
            <h3 style="margin-top: 25px; border-top: 1px solid var(--c-border); padding-top: 20px;">🗓️ Relatório Geral</h3>
            
            <button type="button" id="save-faltas-btn" class="btn-primary btn-full-width" style="background-color: #fff3cd; color: #333; box-shadow: 0 5px #e0a800; border: none; transition: transform 0.1s, box-shadow 0.1s;" onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 1px #e0a800'" onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #e0a800'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #e0a800'">
                💾 SALVAR FALTAS!
            </button>

            <button type="button" id="save-pdf-btn" class="btn-primary btn-full-width" style="background-color: #d4edda; color: #333; box-shadow: 0 5px #28a745; border: none; transition: transform 0.1s, box-shadow 0.1s;" onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 1px #28a745'" onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #28a745'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #28a745'">
                📄 IMPRIMIR RELATÓRIO!
            </button>
            
            <button type="button" id="send-full-report-btn" class="btn-primary btn-full-width" style="background-color: #d1ecf1; color: #333; box-shadow: 0 5px #17a2b8; border: none; transition: transform 0.1s, box-shadow 0.1s;" onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 1px #17a2b8'" onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #17a2b8'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #17a2b8'">
                💬 ENVIAR RELATÓRIO!
            </button>

            <button type="button" id="clear-full-report-btn" class="btn-primary btn-full-width" style="background-color: #f8d7da; color: #333; box-shadow: 0 5px #dc3545; border: none; transition: transform 0.1s, box-shadow 0.1s;" onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 1px #dc3545'" onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #dc3545'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #dc3545'">
                🗑️ LIMPAR HISTÓRICO!
            </button>
            
            <button type="button" id="scroll-to-top-btn" class="btn-primary btn-full-width" style="background-color: #e2e3e5; color: #333; box-shadow: 0 5px #6c757d; border: none; transition: transform 0.1s, box-shadow 0.1s;" onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 1px #6c757d'" onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #6c757d'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #6c757d'">
                ⬆️ VOLTAR AO TOPO!
            </button>
            
            <p id="presenca-status"></p>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    
    // --- NOVO ALERTA CUSTOMIZADO ---
    setTimeout(function() {
        const modal = document.createElement('div');
        modal.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; z-index:9999;";
        
        const box = document.createElement('div');
        box.style.cssText = "background:var(--c-card); color:var(--c-text); padding:20px; border-radius:12px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.3); width: 85%; max-width: 320px; font-family: 'Poppins', sans-serif;";
        
        box.innerHTML = `
            <h3 style="margin-top: 0; font-size: 1.2em;">⚠️ Atenção</h3>
            <p style="margin-bottom: 20px; font-size: 0.95em;">Deseja apagar todo o histórico?</p>
            <div style="display:flex; gap: 10px;">
                <button id="modal-btn-cancel" style="flex: 1; background: #e0e0e0; color: #333; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #b0b0b0;">Cancelar</button>
                <button id="modal-btn-confirm" style="flex: 1; background: salmon; color: #333; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #c86455;">Apagar</button>
            </div>
        `;
        
        modal.appendChild(box);
        document.body.appendChild(modal);

        document.getElementById('modal-btn-cancel').onclick = () => {
            document.body.removeChild(modal);
        };
        
        document.getElementById('modal-btn-confirm').onclick = () => {
            localStorage.removeItem('registroDeFaltas');
            document.body.removeChild(modal);
            
            const success = document.createElement('div');
            success.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:lightgreen; color:#333; padding:12px 24px; border-radius:8px; font-weight:bold; box-shadow:0 4px #78c878; z-index:9999; font-family: 'Poppins', sans-serif;";
            success.innerHTML = "✅ Histórico apagado!";
            document.body.appendChild(success);
            
            setTimeout(() => document.body.removeChild(success), 2500);
        };
    }, 100);

    // --- MANUTENÇÃO DO TEMA CLARO/ESCURO ---
    const rootHtml = document.documentElement;
    const darkModeBtn = document.getElementById('toggle-dark-mode');
    
    const savedTheme = localStorage.getItem('theme') || 'light';
    rootHtml.setAttribute('data-theme', savedTheme);
    
    const toggleDarkMode = () => {
        const newTheme = rootHtml.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        rootHtml.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateDarkModeButton(newTheme);
    };

    const updateDarkModeButton = (currentTheme) => {
        if (darkModeBtn) {
            if (currentTheme === 'dark') {
                darkModeBtn.textContent = '☀️';
                darkModeBtn.style.backgroundColor = '#ffcc66';
                darkModeBtn.style.color = '#333';
            } else {
                darkModeBtn.textContent = '🌙';
                darkModeBtn.style.backgroundColor = '#6c757d';
                darkModeBtn.style.color = 'white';
            }
        }
    };
    
    if (darkModeBtn) {
        darkModeBtn.addEventListener('click', toggleDarkMode);
    }
    
    updateDarkModeButton(savedTheme);

    let state = {
        whatsappNumber: localStorage.getItem('presencaWhatsapp') || '',
        horarios: JSON.parse(localStorage.getItem('horariosPorTurma')) || {},
    };
    
    const dom = Object.fromEntries(
        Array.from(document.querySelectorAll('[id]')).map(el => [el.id.replace(/-(\w)/g, (m, p1) => p1.toUpperCase()), el])
    );
    
    const turmasPorColegio = {
        "Colégio Objetivo": ["1º ANO", "2º ANO", "3º ANO", "4º ANO", "5º ANO-A", "5º ANO-B", "6º ANO", "7º ANO", "8º ANO", "9º ANO", "1º MÉDIO", "2º MÉDIO", "3º MÉDIO"],
        "Colégio GP": ["1º ANO-A", "1º ANO-B", "2º ANO", "3º ANO", "4º ANO-A", "4º ANO-B", "5º ANO"]
    };

    const listasDeAlunos = {
        "Colégio Objetivo|1º ANO": [

    const saveSettings = () => {
        state.whatsappNumber = dom.settingWhatsapp.value.replace(/\D/g, '');
        localStorage.setItem('presencaWhatsapp', state.whatsappNumber);
        alert('Número de WhatsApp salvo com sucesso!');
    };
    
    const saveHorario = (colegio, turma, horario) => {
        if (!colegio || !turma) {
            alert("Erro: Selecione o colégio e a turma para salvar o horário.");
            return false;
        }
        const key = `${colegio}|${turma}`;
        state.horarios[key] = horario;
        localStorage.setItem('horariosPorTurma', JSON.stringify(state.horarios));
        alert(`Horário "${horario}" salvo/editado para a turma ${turma}!`);
        return true;
    };

    const loadHorario = (colegio, turma) => {
        if (!colegio || !turma) return '';
        const key = `${colegio}|${turma}`;
        return state.horarios[key] || '';
    };
    
    const popularTurmas = (colegioSelect, turmaSelect) => {
        const colegioSelecionado = colegioSelect.value;
        turmaSelect.innerHTML = '';
        
        if (colegioSelecionado === "") {
            turmaSelect.disabled = true;
            turmaSelect.classList.add('turma-disabled');
            turmaSelect.innerHTML = '<option value="">Selecione Colégio</option>';
            return;
        }

        turmaSelect.disabled = false;
        turmaSelect.classList.remove('turma-disabled');

        let defaultOption = document.createElement('option');
        defaultOption.value = "";
        defaultOption.textContent = `TURMA`;
        turmaSelect.appendChild(defaultOption);

        const turmas = turmasPorColegio[colegioSelecionado] || [];
        turmas.forEach(turma => {
            let option = document.createElement('option');
            option.value = turma;
            option.textContent = turma;
            turmaSelect.appendChild(option);
        });
    };
    
    const carregarAlunos = (colegio, turma) => {
        const key = `${colegio}|${turma}`;
        const alunos = listasDeAlunos[key];
        const tbody = dom.listaAlunos;
        tbody.innerHTML = ''; 

        if (!alunos) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--c-danger-text); font-style: italic;">Não há lista de alunos cadastrada para esta turma.</td></tr>`;
            return;
        }

        alunos.forEach(nomeAluno => {
            const row = document.createElement('tr');
            row.setAttribute('data-aluno', nomeAluno);
            
            row.innerHTML = `
                <td>${nomeAluno}</td>
                <td class="check-cell col-presenca">
                    <input type="checkbox" class="check-presenca checkbox-presenca-aluno" value="P" checked>
                </td>
                <td class="check-cell col-extra col-apostila" style="display: none;">
                    <input type="checkbox" class="check-ocorrencia checkbox-apostila" title="Esqueceu Apostila">
                </td>
                <td class="check-cell col-extra col-trabalho" style="display: none;">
                    <input type="checkbox" class="check-ocorrencia checkbox-trabalho" title="Não Entregou Trabalho">
                </td>
                <td class="check-cell col-extra col-obs" style="display: none;">
                    <input type="checkbox" class="check-ocorrencia checkbox-obs-toggle" title="Adicionar Observação">
                </td>
            `;
            tbody.appendChild(row);

            const obsRow = document.createElement('tr');
            obsRow.className = 'obs-row';
            obsRow.innerHTML = `
                <td colspan="5" style="padding: 10px; border-bottom: 2px solid var(--c-primary); border-top: none;">
                    <textarea class="obs-textarea" placeholder="Escreva a observação para ${nomeAluno}..."></textarea>
                </td>
            `;
            tbody.appendChild(obsRow);

            const checkObs = row.querySelector('.checkbox-obs-toggle');
            checkObs.addEventListener('change', (e) => {
                if(e.target.checked) {
                    obsRow.classList.add('active');
                } else {
                    obsRow.classList.remove('active');
                    obsRow.querySelector('.obs-textarea').value = ''; 
                }
            });
        });
        
        atualizarColunasVisiveis();
    };

    const atualizarColunasVisiveis = () => {
        const showApostila = document.getElementById('toggle-col-apostila').checked;
        const showTrabalho = document.getElementById('toggle-col-trabalho').checked;
        const showObs = document.getElementById('toggle-col-obs').checked;

        document.querySelectorAll('.col-apostila').forEach(el => el.style.display = showApostila ? 'table-cell' : 'none');
        document.querySelectorAll('.col-trabalho').forEach(el => el.style.display = showTrabalho ? 'table-cell' : 'none');
        document.querySelectorAll('.col-obs').forEach(el => el.style.display = showObs ? 'table-cell' : 'none');
    };

    document.getElementById('toggle-col-apostila').addEventListener('change', atualizarColunasVisiveis);
    document.getElementById('toggle-col-trabalho').addEventListener('change', atualizarColunasVisiveis);
    document.getElementById('toggle-col-obs').addEventListener('change', atualizarColunasVisiveis);

    const btnToggleTodos = document.getElementById('btn-toggle-todos');
    if (btnToggleTodos) {
        btnToggleTodos.dataset.status = 'todos'; 
        btnToggleTodos.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.checkbox-presenca-aluno');
            if (btnToggleTodos.dataset.status === 'todos') {
                checkboxes.forEach(cb => cb.checked = false); 
                btnToggleTodos.dataset.status = 'nenhum';
                btnToggleTodos.textContent = '❌';
            } else {
                checkboxes.forEach(cb => cb.checked = true); 
                btnToggleTodos.dataset.status = 'todos';
                btnToggleTodos.textContent = '✅';
            }
        });
    }

    const btnToggleApostila = document.getElementById('btn-toggle-apostila');
    if (btnToggleApostila) {
        btnToggleApostila.dataset.status = 'nenhum';
        btnToggleApostila.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.checkbox-apostila');
            if (btnToggleApostila.dataset.status === 'nenhum') {
                checkboxes.forEach(cb => cb.checked = true);
                btnToggleApostila.dataset.status = 'todos';
            } else {
                checkboxes.forEach(cb => cb.checked = false);
                btnToggleApostila.dataset.status = 'nenhum';
            }
        });
    }

    const btnToggleTrabalho = document.getElementById('btn-toggle-trabalho');
    if (btnToggleTrabalho) {
        btnToggleTrabalho.dataset.status = 'nenhum';
        btnToggleTrabalho.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.checkbox-trabalho');
            if (btnToggleTrabalho.dataset.status === 'nenhum') {
                checkboxes.forEach(cb => cb.checked = true);
                btnToggleTrabalho.dataset.status = 'todos';
            } else {
                checkboxes.forEach(cb => cb.checked = false);
                btnToggleTrabalho.dataset.status = 'nenhum';
            }
        });
    }
    
    const resetFormulario = () => {
        document.querySelectorAll('.checkbox-presenca-aluno').forEach(cb => cb.checked = true);
        document.querySelectorAll('.check-ocorrencia').forEach(cb => cb.checked = false);
        document.querySelectorAll('.obs-row').forEach(row => row.classList.remove('active'));
        document.querySelectorAll('.obs-textarea').forEach(ta => ta.value = '');
        
        if(btnToggleTodos) {
            btnToggleTodos.textContent = '✅';
            btnToggleTodos.dataset.status = 'todos';
        }
    };
    
    const processarFaltas = () => {
        const colegio = dom.presencaColegio.value;
        const turma = dom.presencaTurma.value;
        const data = dom.presencaData.value;
        const horario = dom.presencaHorario.value.trim() || 'Não Informado';
        
        if (!state.whatsappNumber || state.whatsappNumber.length < 8) {
            return { status: 'error', message: "⚠️ Por favor, salve seu número de WhatsApp nas Configurações." };
        }
        
        if (!colegio || !turma) {
            return { status: 'error', message: "⚠️ Por favor, selecione o Colégio e a Turma." };
        }
        
        let presentes = 0;
        let faltas = []; 
        let ocorrencias = []; 
        let faltasDestaSessao = []; 

        const alunosRows = dom.listaAlunos.querySelectorAll('tr[data-aluno]');
        
        if(alunosRows.length === 0) {
             return { status: 'error', message: "⚠️ Não há alunos para marcar nesta turma." };
        }

        alunosRows.forEach(row => {
            const nomeAluno = row.getAttribute('data-aluno');
            const checkPresenca = row.querySelector('.checkbox-presenca-aluno');
            const checkApostila = row.querySelector('.checkbox-apostila');
            const checkTrabalho = row.querySelector('.checkbox-trabalho');
            const checkObs = row.querySelector('.checkbox-obs-toggle');
            
            const textarea = row.nextElementSibling.querySelector('.obs-textarea');
            
            if (checkPresenca && checkPresenca.checked) {
                presentes++;
            } else {
                faltas.push(nomeAluno); 
                faltasDestaSessao.push({ data: data, colegio: colegio, turma: turma, aluno: nomeAluno }); 
            }

            if (checkApostila && checkApostila.checked) {
                ocorrencias.push({ aluno: nomeAluno, tipo: 'Sem Apostila' });
            }
            if (checkTrabalho && checkTrabalho.checked) {
                ocorrencias.push({ aluno: nomeAluno, tipo: 'Sem Trabalho' });
            }
            if (checkObs && checkObs.checked && textarea.value.trim() !== '') {
                ocorrencias.push({ aluno: nomeAluno, tipo: 'Obs', texto: textarea.value.trim() });
            }
        });
        
        return { status: 'success', colegio, turma, data, horario, presentes, faltas, ocorrencias, faltasDestaSessao };
    };

    const persistirFaltas = (dataSession) => {
        let registrosGerais = JSON.parse(localStorage.getItem('registroDeFaltas')) || [];
        const { colegio, turma, data } = dataSession;

        const sessionKey = `${data}|${colegio}|${turma}`;

        registrosGerais = registrosGerais.filter(f => {
            const fKey = `${f.data}|${f.colegio}|${f.turma}`;
            return fKey !== sessionKey;
        });

        const alunosRows = dom.listaAlunos.querySelectorAll('tr[data-aluno]');
        let temRegistros = false;

        alunosRows.forEach(row => {
            const nomeAluno = row.getAttribute('data-aluno');
            const checkPresenca = row.querySelector('.checkbox-presenca-aluno');
            const checkApostila = row.querySelector('.checkbox-apostila');
            const checkTrabalho = row.querySelector('.checkbox-trabalho');
            const checkObs = row.querySelector('.checkbox-obs-toggle');
            const textarea = row.nextElementSibling.querySelector('.obs-textarea');

            if (checkPresenca && !checkPresenca.checked) {
                registrosGerais.push({ data, colegio, turma, tipo: 'Falta', aluno: nomeAluno });
                temRegistros = true;
            }
            if (checkApostila && checkApostila.checked) {
                registrosGerais.push({ data, colegio, turma, tipo: 'Apostila', aluno: nomeAluno });
                temRegistros = true;
            }
            if (checkTrabalho && checkTrabalho.checked) {
                registrosGerais.push({ data, colegio, turma, tipo: 'Trabalho', aluno: nomeAluno });
                temRegistros = true;
            }
            if (checkObs && checkObs.checked && textarea.value.trim() !== '') {
                registrosGerais.push({ data, colegio, turma, tipo: 'Obs', aluno: nomeAluno, texto: textarea.value.trim() });
                temRegistros = true;
            }
        });

        if (!temRegistros) {
            registrosGerais.push({ data, colegio, turma, tipo: 'PRESENTE', aluno: 'PRESENTE' });
        }
        
        localStorage.setItem('registroDeFaltas', JSON.stringify(registrosGerais));
    };

    const apenasSalvarFaltas = () => {
        const data = processarFaltas();
        if (data.status === 'error') {
            dom.presencaStatus.textContent = data.message;
            return;
        }
        
        let msg = (data.faltas.length > 0)
            ? `Confirma as seguintes ${data.faltas.length} falta(s)?\n\n${data.faltas.join('\n')}\n\nAo clicar 'OK', as faltas serão salvas no histórico.`
            : "Nenhuma falta registrada.\n\nConfirma o registro de 100% de presença para esta aula?";
        
        if (!confirm(msg)) {
            dom.presencaStatus.textContent = "Salvamento cancelado.";
            return;
        }
        
        persistirFaltas(data); 
        resetFormulario();
        dom.presencaStatus.textContent = "✅ Presença registrada no histórico com sucesso!";
    };

        <tr><td style="padding: 8px; border: 1px solid var(--c-border);">11:10 às 12:00</td><td style="padding: 8px; border: 1px solid var(--c-border); font-weight: bold;">1º ANO-A</td></tr>
        <tr style="background: rgba(255, 165, 0, 0.2);"><td colspan="2" style="padding: 4px; font-size: 0.8em; color: var(--c-text-gray);">ALMOÇO (12:00 às 13:00)</td></tr>
        <tr><td style="padding: 8px; border: 1px solid var(--c-border);">13:00 às 13:50</td><td style="padding: 8px; border: 1px solid var(--c-border); font-weight: bold;">2º ANO</td></tr>
        <tr><td style="padding: 8px; border: 1px solid var(--c-border);">13:50 às 14:40</td><td style="padding: 8px; border: 1px solid var(--c-border); font-weight: bold;">4º ANO-B</td></tr>
        <tr style="background: rgba(255, 165, 0, 0.2);"><td colspan="2" style="padding: 4px; font-size: 0.8em; color: var(--c-text-gray);">INTERVALO (14:40 às 15:00)</td></tr>
        <tr><td style="padding: 8px; border: 1px solid var(--c-border);">15:00 às 15:50</td><td style="padding: 8px; border: 1px solid var(--c-border); font-weight: bold;">1º ANO-B</td></tr>
    </table>
</div>
            `;
        } else {
            titulo = `Grade - ${colegioSelecionado}`;
            tabelaHTML = `<p style="text-align:center; padding: 15px;">A grade deste colégio ainda não foi cadastrada.</p>`;
        }

        const modalGrade = document.createElement('div');
        modalGrade.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; z-index:9999;";
        
        const boxGrade = document.createElement('div');
        boxGrade.style.cssText = "background:var(--c-card); color:var(--c-text); padding:20px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.3); width: 90%; max-width: 400px; font-family: 'Poppins', sans-serif; display: flex; flex-direction: column;";
        
        boxGrade.innerHTML = `
            <h3 style="margin-top: 0; font-size: 1.1em; text-align: center; border-bottom: 2px solid var(--c-border); padding-bottom: 10px; margin-bottom: 5px;">🗓️ ${titulo}</h3>
            ${tabelaHTML}
            <button id="modal-grade-fechar" style="width: 100%; margin-top: 15px; background: #e0e0e0; color: #333; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #b0b0b0;">Fechar Tabela</button>
        `;
        
        modalGrade.appendChild(boxGrade);
        document.body.appendChild(modalGrade);

        document.getElementById('modal-grade-fechar').onclick = () => {
            document.body.removeChild(modalGrade);
        };
    });

});



</script>
</body>
</html>
