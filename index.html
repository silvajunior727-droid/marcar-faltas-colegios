<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>


<!-- CONFIGURAÇÕES DE PWA E ÍCONES PARA O APLICATIVO -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7abaf2">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Para iPhone / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Presença">
    <link rel="apple-touch-icon" href="icon-192.png">



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Presença Escolar 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"> 
    
    <style>
        /* Estilos base copiados e simplificados */
        :root {
            --c-primary: #7abaf2;
            --c-secondary: #50e3c2;
            --c-success: #28a745;
            --c-bg: #f7f9fc;
            --c-card: #ffffff;
            --c-text: #333;
            --c-text-gray: #777;
            --c-border: #eee;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --c-danger-text: #721c24;
            --c-danger-bg: #dc3545;
            --c-warning-bg: salmon;
            --c-info-bg: lightgreen; 
            --c-input-readonly-bg: #eee;
        }

        /* VARIAVEIS PARA MODO ESCURO */
        html[data-theme="dark"] {
            --c-bg: #1e1e1e;
            --c-card: #2d2d2d;
            --c-text: #f0f0f0;
            --c-text-gray: #bbb;
            --c-border: #444;
            --shadow: 0 4px 15px rgba(0,0,0,0.4);
            --c-primary: #8ab4f8; 
            --c-secondary: #50e3c2; 
            --c-danger-text: #ff9999;
            --c-danger-bg: #cc3333;
            --c-warning-bg: salmon;
            --c-info-bg: lightgreen;
            --c-input-readonly-bg: #3c3c3c; 
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--c-bg);
            color: var(--c-text);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container { max-width: 700px; margin: auto; }
        .card { 
            background-color: var(--c-card); 
            border-radius: 12px; 
            padding: 25px; 
            box-shadow: var(--shadow); 
            margin-bottom: 25px;
            transition: background-color 0.3s, box-shadow 0.3s; 
        }
        h1 { color: var(--c-primary); text-align: center; margin-bottom: 10px; font-size: 2em; }
        h2 { 
            margin-top: 0; 
            color: var(--c-text); 
            border-bottom: 2px solid var(--c-primary); 
            padding-bottom: 10px; 
            display: inline-block; 
        }

/* Formulário e Combos */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-field { display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-weight: 600; font-size: 0.9em; }
input[type="text"], input[type="tel"], input[type="date"], select { 
            width: 100%;
            box-sizing: border-box;
            padding: 12px; 
            border: 1px solid #999999; /* Borda cinza forte e bem definida */
            border-radius: 8px; 
            font-size: 1em; 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--c-bg);
            color: var(--c-text);
            transition: background-color 0.3s, border-color 0.3s;
        }
        
        /* ESTILO PARA INPUTS READ-ONLY E TURMAS DESABILITADAS */
        input:read-only { 
            background-color: var(--c-input-readonly-bg); 
            color: var(--c-text);
        }
        .turma-disabled { 
            background-color: var(--c-input-readonly-bg); 
            color: var(--c-text-gray); 
            cursor: not-allowed; 
        }

        /* Estilo para agrupar Horário e Botão de Salvar */
        .horario-group { 
            display: flex; 
            gap: 10px; 
            align-items: flex-end;
        }
        .horario-group input { 
            flex-grow: 1; 
            margin-bottom: 0;
        }
        .horario-group button {
            padding: 12px 15px;
            font-size: 0.9em;
            background-color: var(--c-primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        .horario-group button:hover {
            background-color: #3a75b8;
        }
        
        /* Tabela de Presença */
        .table-wrapper {
            overflow-x: auto; 
            margin-top: 20px;
        }
        table { 
            width: 100%; 
            min-width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05); 
        }
        th, td { 
            padding: 12px 15px; 
            border-bottom: 1px solid var(--c-border); 
            text-align: left;
            background-color: var(--c-card);
            transition: background-color 0.3s; 
        }
        th { 
            background-color: var(--c-primary); 
            color: #333; 
            font-weight: 700; 
            text-align: center; 
        }
        
        /* --- NOVOS ESTILOS: CAIXAS DE SELEÇÃO E OBSERVAÇÕES --- */
        .check-cell { text-align: center; vertical-align: middle; }
        
        /* Aumentando as caixinhas para facilitar o clique */
        .check-cell input[type="checkbox"] { 
            transform: scale(1.6); 
            cursor: pointer; 
            margin: 0;
        }
        
        /* Cores: Verde claro para presença, Salmão para ocorrências */
        .check-presenca { accent-color: lightgreen; }
        .check-ocorrencia { accent-color: salmon; }
        
        /* Linha oculta para a caixa de observação */
        .obs-row {
            display: none;
            background-color: var(--c-bg);
        }
        .obs-row.active {
            display: table-row;
        }
        .obs-textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px dashed var(--c-primary);
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9em;
            resize: vertical;
            min-height: 45px;
            box-sizing: border-box;
            background-color: var(--c-card);
            color: var(--c-text);
        }
        /* ------------------------------------------------------ */

        /* Estilos de Botões */
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-primary { 
            background-color: var(--c-primary); color: white; padding: 10px; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: #3a75b8; }
        .btn-full-width {
            width: 100%; margin-top: 10px; font-size: 1em; padding: 12px;
        }
        .btn-warning { 
            background-color: var(--c-warning-bg); 
            color: #333; 
        }
        .btn-warning:hover { filter: brightness(0.9); }
        .btn-info { 
            background-color: var(--c-info-bg); 
            color: #333; 
        }
        .btn-info:hover { filter: brightness(0.9); }
        #send-full-report-btn { color: #333; }
        #clear-full-report-btn { color: #333; }
        
        #scroll-to-top-btn {
            background-color: #6c757d; 
            color: black !important;
        }
        #scroll-to-top-btn:hover { background-color: #5a6268; }
        
        #presenca-status { margin-top: 15px; color: var(--c-danger-text); text-align: center; font-weight: 600; }   

        .utility-buttons {
            display: flex;
            gap: 10px;
            float: right;
            margin-top: -10px;
        }
        .utility-buttons button {
            font-size: 1.2em; 
            padding: 10px 15px; 
            min-width: 80px; 
            box-sizing: border-box;
        }
        
        #toggle-dark-mode {
            background-color: #6c757d; 
            color: white; 
        }

/* AJUSTES PARA DISPOSITIVOS MÓVEIS */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .card { padding: 15px; }
            h1 { font-size: 1.5em; margin-top: 10px; margin-bottom: 10px; }
            h2 { margin-top: 15px; }
            .form-grid { grid-template-columns: 1fr 1fr; gap: 10px; } /* Layout 2 e 2 */
            .form-field input[type="text"], .form-field input[type="date"], .form-field select { padding: 10px; }
            .utility-buttons { margin-top: 0; float: none; justify-content: space-between; width: 100%; margin-bottom: 10px; }
            .utility-buttons button { flex-grow: 1; min-width: auto; }
            
            .table-wrapper { overflow-x: hidden; }
            table { width: 100%; }
            th, td { padding: 8px 5px; font-size: 0.8em; white-space: normal; }
            th:nth-child(1), td:nth-child(1) { width: auto; font-size: 0.85em; }
            .check-cell { padding: 8px 5px; }
            /* No celular a caixa fica um pouquinho menor para caber todas as opções lado a lado */
            .check-cell input[type="checkbox"] { transform: scale(1.4); } 
        }




@page {
            size: auto;
            margin: 8mm;
        }

        /* ESTILOS DE IMPRESSÃO BLOQUEADOS POR DIA */
        @media print {
            body, html {
                margin: 0 !important;
                padding: 0 !important;
                background-color: white !important;
            }
            body * { 
                visibility: hidden !important; 
            }
            #tabela-impressao-temp, 
            #tabela-impressao-temp * { 
                visibility: visible !important; 
            }
            #tabela-impressao-temp { 
                position: absolute !important; 
                left: 0 !important; 
                top: 0 !important; 
                width: 100% !important;
                margin: 0 !important; 
                padding: 0 !important; 
                background-color: white !important; 
                color: #000 !important;
            }
            /* IMPEDE QUE O BLOCO DE UM DIA SEJA QUEBRADO ENTRE PÁGINAS */
            .print-day-block {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                margin-bottom: 12px !important;
            }
            .print-table-content { 
                width: 100% !important;
                border-collapse: collapse !important;
                margin-top: 4px !important; 
                margin-bottom: 6px !important; 
            }
            .print-table-content th { 
                background-color: #f0f0f0 !important; 
                color: #000 !important; 
                font-weight: bold; 
                border: 1px solid #000 !important; 
                padding: 5px 8px !important; 
                text-align: left; 
            }
            .print-table-content td { 
                border: 1px solid #ccc !important; 
                border-top: none !important; 
                border-bottom: none !important; 
                padding: 4px 8px !important; 
                background-color: #fff !important; 
                color: #000 !important;
            }
            .print-table-content tr:last-child td { 
                border-bottom: 1px solid #000 !important; 
            }
            #tabela-impressao-temp h1 { 
                font-size: 1.3em !important; 
                border-bottom: 2px solid #000 !important; 
                padding-bottom: 4px !important; 
                margin-bottom: 4px !important; 
                color: #000 !important; 
                text-align: center; 
            }
            #tabela-impressao-temp h2 { 
                font-size: 0.9em !important; 
                padding: 0 !important; 
                margin-bottom: 10px !important; 
                text-align: center; 
                font-weight: normal; 
                border-bottom: 1px solid #999 !important; 
                padding-bottom: 3px !important; 
            }
            #tabela-impressao-temp h3 { 
                font-size: 1em !important; 
                margin-top: 6px !important; 
                margin-bottom: 3px !important; 
                font-weight: bold; 
                color: #000 !important; 
                border-bottom: 1px dashed #ccc !important; 
                padding-bottom: 2px !important; 
            }
        }


    </style>
</head>
<body>

    <div class="container">
        <h1>📚 Sistema de Registro de Presença 2026</h1>
        <p style="text-align: center; font-weight: 600; margin-top: -5px; margin-bottom: 25px; color: var(--c-primary);"></p>
        
        <div class="card">
            <div class="utility-buttons">
                <button id="toggle-dark-mode" class="btn-primary">
                    🌙
                </button>
                <button id="toggle-settings-btn" class="btn-primary">
                    ⚙️
                </button>
            </div>
            <h2>Configurações</h2>
            
            <div id="settings-panel" style="display: none;">
                <h3>📞 Número de WhatsApp:</h3>
                <div class="form-grid">
                    <div class="form-field" style="grid-column: 1 / -1;">
                        <input type="tel" id="setting-whatsapp" placeholder="Ex: 5511987654321 (apenas números)">
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn-primary" id="save-settings-btn" style="flex-grow: 2;">Salvar Número</button>
                </div>

                <h3 style="margin-top: 25px; border-top: 1px solid var(--c-border); padding-top: 20px;">⏰ Configurar Horários</h3>
                <div class="form-grid">
                    <div class="form-field">
                        <label for="setting-colegio">Colégio:</label>
                        <select id="setting-colegio">
                            <option value="">-- Escolha --</option>
                            <option value="Colégio Objetivo">OBJETIVO</option>
                            <option value="Colégio GP">GP</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="setting-turma">Turma:</label>
                        <select id="setting-turma" class="turma-disabled" disabled>
                            <option value="">Selecione Colégio</option>
                        </select>
                    </div>
                    <div class="form-field" style="grid-column: 1 / -1;">
                        <label for="setting-horario">Horário da Aula:</label>
                        <div class="horario-group">
                            <input type="text" id="setting-horario" placeholder="Ex: 14h00 às 15h30">
                            <button type="button" id="setting-save-horario-btn" class="btn-primary">Salvar Horário</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card" id="presenca-card">
            <h2>Lançamento Diário</h2>
            <form id="formPresenca">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="presenca-colegio">Colégio:</label>
                        <select id="presenca-colegio" required>
                            <option value="">-- Mudar Colégio --</option>
                            <option value="Colégio Objetivo" selected>OBJETIVO</option>
                            <option value="Colégio GP">GP</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="presenca-turma">Turma:</label>
                        <select id="presenca-turma" class="turma-disabled" disabled required>
                            <option value="">Selecione um Colégio primeiro</option>
                        </select>
                    </div>
                    
                    <div class="form-field">
                        <label for="presenca-data">Data:</label>
                        <input type="date" id="presenca-data" required>
                    </div>
                    
<div class="form-field">
                        <label for="presenca-horario">Horário:</label>
                        <input type="text" id="presenca-horario" readonly>
                    </div>
                    
                    <!-- NOVO: SELETORES DE EXIBIÇÃO DA TABELA -->
                    <div class="form-field" style="grid-column: 1 / -1; margin-top: 10px;">
                        <label>O que registrar hoje?</label>
                        <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 5px;">
                            <label style="cursor: pointer; font-weight: 600;"><input type="checkbox" id="toggle-col-presenca" checked disabled> ✅ Presença</label>
                            <label style="cursor: pointer;"><input type="checkbox" id="toggle-col-apostila"> 📖 Apostila</label>
                            <label style="cursor: pointer;"><input type="checkbox" id="toggle-col-trabalho"> 📄 Trabalho</label>
                            <label style="cursor: pointer;"><input type="checkbox" id="toggle-col-obs"> 💬 Observação</label>
                        </div>
                    </div>
                </div>

                <hr>
                <div class="table-wrapper"> 
                    <table id="tabela-presenca">
                        <thead>
                            <tr>
                                <th style="width: 50%;">Nome do Aluno</th>
                                
                                <!-- COLUNA 1: PRESENÇA (Com botão Mestre) -->
                                <th class="col-presenca" style="text-align: center; cursor: pointer;" title="Marcar/Desmarcar Todos">
                                    <button type="button" id="btn-toggle-todos" style="border: none; background: transparent; cursor: pointer; font-size: 1.3em;">✅</button>
                                </th>
                                
			<!-- COLUNAS EXTRAS COM BOTÃO MESTRE -->
                                <th class="col-extra col-apostila" style="display: none; text-align: center;" title="Marcar/Desmarcar Todos - Apostila">
                                    <button type="button" id="btn-toggle-apostila" style="border: none; background: transparent; cursor: pointer; font-size: 1.3em;">📖</button>
                                </th>
                                <th class="col-extra col-trabalho" style="display: none; text-align: center;" title="Marcar/Desmarcar Todos - Trabalho">
                                    <button type="button" id="btn-toggle-trabalho" style="border: none; background: transparent; cursor: pointer; font-size: 1.3em;">📄</button>
                                </th>
                                <th class="col-extra col-obs" style="display: none; text-align: center; font-size: 1.5em;" title="Adicionar Observação">💬</th>
                            </tr>
                        </thead>
                        <tbody id="listaAlunos">
                            <tr><td colspan="5" style="text-align: center;">Selecione um Colégio e uma Turma para carregar a lista de alunos.</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <h3 style="margin-top: 25px; border-top: 1px solid var(--c-border); padding-top: 20px;">🗓️ Relatório Geral</h3>
                
<button type="button" id="save-faltas-btn" class="btn-primary btn-full-width" style="background-color: #fff3cd; color: #333; box-shadow: 0 5px #e0a800; border: none; transition: transform 0.1s, box-shadow 0.1s;" onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 1px #e0a800'" onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #e0a800'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #e0a800'">
                    💾 SALVAR FALTAS!
                </button>

                <button type="button" id="save-pdf-btn" class="btn-primary btn-full-width" style="background-color: #d4edda; color: #333; box-shadow: 0 5px #28a745; border: none; transition: transform 0.1s, box-shadow 0.1s;" onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 1px #28a745'" onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #28a745'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #28a745'">
                    📄 IMPRIMIR RELATÓRIO!
                </button>
                
                <button type="button" id="send-full-report-btn" class="btn-primary btn-full-width" style="background-color: #d1ecf1; color: #333; box-shadow: 0 5px #17a2b8; border: none; transition: transform 0.1s, box-shadow 0.1s;" onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 1px #17a2b8'" onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #17a2b8'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #17a2b8'">
                    💬 ENVIAR RELATÓRIO!
                </button>

                <button type="button" id="clear-full-report-btn" class="btn-primary btn-full-width" style="background-color: #f8d7da; color: #333; box-shadow: 0 5px #dc3545; border: none; transition: transform 0.1s, box-shadow 0.1s;" onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 1px #dc3545'" onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #dc3545'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #dc3545'">
                    🗑️ LIMPAR HISTÓRICO!
                </button>
                
                <button type="button" id="scroll-to-top-btn" class="btn-primary btn-full-width" style="background-color: #e2e3e5; color: #333; box-shadow: 0 5px #6c757d; border: none; transition: transform 0.1s, box-shadow 0.1s;" onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 1px #6c757d'" onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #6c757d'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 5px #6c757d'">
                    ⬆️ VOLTAR AO TOPO!
                </button>
                
                <p id="presenca-status"></p>
            </form>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    
    // --- NOVO ALERTA CUSTOMIZADO (SEM MOSTRAR O GITHUB) ---
    setTimeout(function() {
        // Criação da janela de fundo escuro
        const modal = document.createElement('div');
        modal.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; z-index:9999;";
        
        // Criação da caixinha de aviso com suporte ao seu Modo Escuro/Claro
        const box = document.createElement('div');
        box.style.cssText = "background:var(--c-card); color:var(--c-text); padding:20px; border-radius:12px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.3); width: 85%; max-width: 320px; font-family: 'Poppins', sans-serif;";
        
        // Conteúdo, ícones e botões no estilo 3D da sua aplicação
        box.innerHTML = `
            <h3 style="margin-top: 0; font-size: 1.2em;">⚠️ Atenção</h3>
            <p style="margin-bottom: 20px; font-size: 0.95em;">Deseja apagar todo o histórico?</p>
            <div style="display:flex; gap: 10px;">
                <button id="modal-btn-cancel" style="flex: 1; background: #e0e0e0; color: #333; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #b0b0b0;">Cancelar</button>
                <button id="modal-btn-confirm" style="flex: 1; background: salmon; color: #333; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #c86455;">Apagar</button>
            </div>
        `;
        
        modal.appendChild(box);
        document.body.appendChild(modal);

        // Ação do Botão Cancelar (Apenas fecha a janela)
        document.getElementById('modal-btn-cancel').onclick = () => {
            document.body.removeChild(modal);
        };
        
        // Ação do Botão Apagar (Remove os dados e mostra o aviso de sucesso)
        document.getElementById('modal-btn-confirm').onclick = () => {
            localStorage.removeItem('registroDeFaltas');
            document.body.removeChild(modal);
            
            // Aviso de sucesso estilo "Notificação" flutuante (substitui o 'alert' nativo)

            }

            // 2. Checa Ocorrências
            if (checkApostila && checkApostila.checked) {
                ocorrencias.push({ aluno: nomeAluno, tipo: 'Sem Apostila' });
            }
            if (checkTrabalho && checkTrabalho.checked) {
                ocorrencias.push({ aluno: nomeAluno, tipo: 'Sem Trabalho' });
            }
            if (checkObs && checkObs.checked && textarea.value.trim() !== '') {
                ocorrencias.push({ aluno: nomeAluno, tipo: 'Obs', texto: textarea.value.trim() });
            }
        });
        
        return { status: 'success', colegio, turma, data, horario, presentes, faltas, ocorrencias, faltasDestaSessao };
    };

// --- FUNÇÃO ATUALIZADA: PERSISTIR TODAS AS OCORRÊNCIAS NO HISTÓRICO ---
    const persistirFaltas = (dataSession) => {
        let registrosGerais = JSON.parse(localStorage.getItem('registroDeFaltas')) || [];
        const { colegio, turma, data } = dataSession;

        const sessionKey = `${data}|${colegio}|${turma}`;

        // Remove registros antigos desta mesma sessão para evitar duplicidade
        registrosGerais = registrosGerais.filter(f => {
            const fKey = `${f.data}|${f.colegio}|${f.turma}`;
            return fKey !== sessionKey;
        });

        const alunosRows = dom.listaAlunos.querySelectorAll('tr[data-aluno]');
        let temRegistros = false;

        alunosRows.forEach(row => {
            const nomeAluno = row.getAttribute('data-aluno');
            const checkPresenca = row.querySelector('.checkbox-presenca-aluno');
            const checkApostila = row.querySelector('.checkbox-apostila');
            const checkTrabalho = row.querySelector('.checkbox-trabalho');
            const checkObs = row.querySelector('.checkbox-obs-toggle');
            const textarea = row.nextElementSibling.querySelector('.obs-textarea');

            // Falta
            if (checkPresenca && !checkPresenca.checked) {
                registrosGerais.push({ data, colegio, turma, tipo: 'Falta', aluno: nomeAluno });
                temRegistros = true;
            }
            // Apostila
            if (checkApostila && checkApostila.checked) {
                registrosGerais.push({ data, colegio, turma, tipo: 'Apostila', aluno: nomeAluno });
                temRegistros = true;
            }
            // Trabalho
            if (checkTrabalho && checkTrabalho.checked) {
                registrosGerais.push({ data, colegio, turma, tipo: 'Trabalho', aluno: nomeAluno });
                temRegistros = true;
            }
            // Observação
            if (checkObs && checkObs.checked && textarea.value.trim() !== '') {
                registrosGerais.push({ data, colegio, turma, tipo: 'Obs', aluno: nomeAluno, texto: textarea.value.trim() });
                temRegistros = true;
            }
        });

        if (!temRegistros) {
            registrosGerais.push({ data, colegio, turma, tipo: 'PRESENTE', aluno: 'PRESENTE' });
        }
        
        localStorage.setItem('registroDeFaltas', JSON.stringify(registrosGerais));
    };


    const apenasSalvarFaltas = () => {
        const data = processarFaltas();
        if (data.status === 'error') {
            dom.presencaStatus.textContent = data.message;
            return;
        }
        
        let msg = (data.faltas.length > 0)
            ? `Confirma as seguintes ${data.faltas.length} falta(s)?\n\n${data.faltas.join('\n')}\n\nAo clicar 'OK', as faltas serão salvas no histórico.`
            : "Nenhuma falta registrada.\n\nConfirma o registro de 100% de presença para esta aula?";
        
        if (!confirm(msg)) {
            dom.presencaStatus.textContent = "Salvamento cancelado.";
            return;
        }
        
        persistirFaltas(data); 
        resetFormulario();
        dom.presencaStatus.textContent = "✅ Presença registrada no histórico com sucesso.";
    };

    // --- FUNÇÃO ATUALIZADA: GERAR RELATÓRIO COM AS OCORRÊNCIAS ---
    const gerarRelatorioPresenca = (e) => {
        e.preventDefault();
        const data = processarFaltas();
        
        if (data.status === 'error') {
            dom.presencaStatus.textContent = data.message;
            return;
        }

        let msg = (data.faltas.length > 0)
            ? `Confirma as seguintes ${data.faltas.length} falta(s)?\n\n${data.faltas.join('\n')}\n\nAo clicar 'OK', o relatório DIÁRIO será enviado e as faltas salvas.`
            : "Nenhuma falta registrada.\n\nDeseja enviar o relatório de presença diário mesmo assim?";
        
        if (!confirm(msg)) {
            dom.presencaStatus.textContent = "Envio cancelado.";
            return;
        }
        
        persistirFaltas(data);

        let relatorio = `*✅ REGISTRO DE PRESENÇA - ${data.data}*\n`;
        relatorio += `---------------------------------\n`;
        relatorio += `*🏫 Colégio:* ${data.colegio}\n`;
        relatorio += `*📚 Turma:* ${data.turma}\n`;
        relatorio += `*⏰ Horário:* ${data.horario}\n\n`;
        relatorio += `*📝 Status dos Alunos:*\n`;
        relatorio += `*✅ Total de Presentes:* ${data.presentes}\n`;
        relatorio += `*❌ Lista de Faltas (${data.faltas.length}):*\n`;
        
        if (data.faltas.length > 0) {
            data.faltas.forEach(aluno => {
                relatorio += `- ${aluno}\n`;
            });
        } else {
            relatorio += `- 100% de Presença registrada. Nenhuma falta.\n`;
        }
        
        // ADICIONA AS OCORRÊNCIAS NO RELATÓRIO DE WHATSAPP
        if (data.ocorrencias && data.ocorrencias.length > 0) {
            relatorio += `\n*⚠️ OCORRÊNCIAS REGISTRADAS:*\n`;
            data.ocorrencias.forEach(oc => {
                if (oc.tipo === 'Obs') {
                    relatorio += `> *${oc.aluno}* (Observação): ${oc.texto}\n`;
                } else {
                    relatorio += `> *${oc.aluno}*: ${oc.tipo}\n`;
                }
            });
        }

        relatorio += `\n_Relatório gerado pelo Sistema de Presença._`;
        
        resetFormulario();
        
        const whatsappLinkDiario = `https://wa.me/${state.whatsappNumber}?text=${encodeURIComponent(relatorio)}`;
        window.open(whatsappLinkDiario, '_blank');
        
        dom.presencaStatus.textContent = "✅ Relatório DIÁRIO enviado. Presença salva.";
    };
    
    


// --- FUNÇÃO ATUALIZADA: RELATÓRIO GERAL NO WHATSAPP COM TODAS AS OCORRÊNCIAS ---
    const enviarRelatorioGeral = (silentMode = false) => {
        if (!state.whatsappNumber || state.whatsappNumber.length < 8) {
            if (!silentMode) { 
                alert("⚠️ Por favor, salve seu número de WhatsApp nas Configurações acima.");
            }
            return;
        }

        let registrosGerais = JSON.parse(localStorage.getItem('registroDeFaltas')) || [];
        
        if (registrosGerais.length === 0) {
            if (!silentMode) { 
                alert('Nenhum registro encontrado no histórico.');
            }
            return;
        }

        let relatorioGeral = `*HISTÓRICO GERAL DE OCORRÊNCIAS E PRESENÇA*\n`;
        relatorioGeral += `---------------------------------\n\n`;
        
        let sessoesAgrupadas = {};
        registrosGerais.forEach(reg => {
            const key = `*${reg.data}* - ${reg.colegio} (${reg.turma})`;
            if (!sessoesAgrupadas[key]) {
                sessoesAgrupadas[key] = [];
            }
            sessoesAgrupadas[key].push(reg);
        });

        for (const key in sessoesAgrupadas) {
            relatorioGeral += `${key}\n`;
            const itens = sessoesAgrupadas[key];
            
            if (itens.length === 1 && itens[0].tipo === 'PRESENTE') {
                relatorioGeral += `*✅ 100% de Presença - Nenhuma ocorrência.*\n`;
            } else {
                let faltas = itens.filter(i => i.tipo === 'Falta').map(i => i.aluno);
                let apostilas = itens.filter(i => i.tipo === 'Apostila').map(i => i.aluno);
                let trabalhos = itens.filter(i => i.tipo === 'Trabalho').map(i => i.aluno);
                let obsList = itens.filter(i => i.tipo === 'Obs');

                if (faltas.length > 0) {
                    relatorioGeral += `  ❌ *Faltas (${faltas.length}):*\n`;
                    faltas.forEach(aluno => relatorioGeral += `    - ${aluno}\n`);
                }
                if (apostilas.length > 0) {
                    relatorioGeral += `  📖 *Esqueceram Apostila (${apostilas.length}):*\n`;
                    apostilas.forEach(aluno => relatorioGeral += `    - ${aluno}\n`);
                }
                if (trabalhos.length > 0) {
                    relatorioGeral += `  📄 *Não Entregaram Trabalho (${trabalhos.length}):*\n`;
                    trabalhos.forEach(aluno => relatorioGeral += `    - ${aluno}\n`);
                }
                if (obsList.length > 0) {
                    relatorioGeral += `  💬 *Observações:*\n`;
                    obsList.forEach(obs => relatorioGeral += `    - *${obs.aluno}*: ${obs.texto}\n`);
                }
            }
            relatorioGeral += `\n`; 
        }
        
        relatorioGeral += `\n_Relatório geral gerado em ${new Date().toLocaleDateString('pt-BR')}_`;

        const whatsappLinkGeral = `https://wa.me/${state.whatsappNumber}?text=${encodeURIComponent(relatorioGeral)}`;
        window.open(whatsappLinkGeral, '_blank');
    };




   const limparRelatorioGeral = () => {
        if (confirm('Tem certeza que deseja apagar PERMANENTEMENTE todo o histórico? Esta ação não pode ser desfeita.')) {
            localStorage.removeItem('registroDeFaltas');
            alert('Histórico foi limpo com sucesso.');
        }
    };
    

   // --- FUNÇÃO CORRIGIDA: IMPRESSÃO LIMPA SEM FOLHAS EM BRANCO ---
    const imprimirRelatorioGeral = () => {
        let registrosGerais = JSON.parse(localStorage.getItem('registroDeFaltas')) || [];
        
        if (registrosGerais.length === 0) {
            alert('Nenhum registro encontrado no histórico para gerar o Relatório Geral.');
            dom.presencaStatus.textContent = "⚠️ Nenhum registro encontrado no histórico.";            
            return;
        }

        let sessoesAgrupadas = {};
        registrosGerais.forEach(reg => {
            const key = `${reg.data} | ${reg.colegio} (${reg.turma})`;
            if (!sessoesAgrupadas[key]) {
                sessoesAgrupadas[key] = [];
            }
            sessoesAgrupadas[key].push(reg);
        });

        const tempDiv = document.createElement('div');
        tempDiv.id = 'tabela-impressao-temp';
        
        let relatorioHTML = ``;
        
        // Cabeçalho geral no topo da impressão
        relatorioHTML += `<div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 15px;">`;
        relatorioHTML += `<h1 style="font-size: 1.4em; margin-bottom: 2px; color: #000 !important;">HISTÓRICO GERAL DE OCORRÊNCIAS E PRESENÇA</h1>`;
        relatorioHTML += `<h2 style="font-size: 0.85em; font-weight: normal; color: #333 !important; margin: 0;">Relatório gerado em ${new Date().toLocaleString('pt-BR')}</h2>`;
        relatorioHTML += `</div>`;
        
        // Loop por cada dia/sessão encapsulado na div de proteção contra quebras
        for (const key in sessoesAgrupadas) {
            const [data, info] = key.split(' | ');

            relatorioHTML += `<div class="print-day-block">`;
            relatorioHTML += `<h3 style="font-size: 1em; margin-top: 10px; margin-bottom: 4px; font-weight: bold; color: #000 !important; border-bottom: 1px dashed #ccc; padding-bottom: 2px;">${data} - ${info}</h3>`;
            
            const itens = sessoesAgrupadas[key];
            
            if (itens.length === 1 && itens[0].tipo === 'PRESENTE') {
                relatorioHTML += `<table class="print-table-content" style="width: 100%;">`;
                relatorioHTML += `<thead><tr><th style="width: 100%; background-color: #d4edda !important; color: #155724 !important;">✅ 100% de Presença - Nenhuma ocorrência registrada.</th></tr></thead>`;
                relatorioHTML += `</table>`;
            } else {
                let faltas = itens.filter(i => i.tipo === 'Falta');
                let apostilas = itens.filter(i => i.tipo === 'Apostila');
                let trabalhos = itens.filter(i => i.tipo === 'Trabalho');
                let obsList = itens.filter(i => i.tipo === 'Obs');

                if (faltas.length > 0) {
                    relatorioHTML += `<table class="print-table-content" style="width: 100%;">`;
                    relatorioHTML += `<thead><tr><th style="width: 100%;">❌ Alunos Faltantes (${faltas.length})</th></tr></thead><tbody>`;
                    faltas.forEach(f => relatorioHTML += `<tr><td>${f.aluno}</td></tr>`);
                    relatorioHTML += `</tbody></table>`;
                }

                if (apostilas.length > 0) {
                    relatorioHTML += `<table class="print-table-content" style="width: 100%;">`;
                    relatorioHTML += `<thead><tr><th style="width: 100%;">📖 Esqueceram a Apostila (${apostilas.length})</th></tr></thead><tbody>`;
                    apostilas.forEach(a => relatorioHTML += `<tr><td>${a.aluno}</td></tr>`);
                    relatorioHTML += `</tbody></table>`;
                }

                if (trabalhos.length > 0) {
                    relatorioHTML += `<table class="print-table-content" style="width: 100%;">`;
                    relatorioHTML += `<thead><tr><th style="width: 100%;">📄 Não Entregaram o Trabalho (${trabalhos.length})</th></tr></thead><tbody>`;
                    trabalhos.forEach(t => relatorioHTML += `<tr><td>${t.aluno}</td></tr>`);
                    relatorioHTML += `</tbody></table>`;
                }

                if (obsList.length > 0) {
                    relatorioHTML += `<table class="print-table-content" style="width: 100%;">`;
                    relatorioHTML += `<thead><tr><th style="width: 100%;">💬 Observações Registradas (${obsList.length})</th></tr></thead><tbody>`;
                    obsList.forEach(o => relatorioHTML += `<tr><td><strong>${o.aluno}:</strong> ${o.texto}</td></tr>`);
                    relatorioHTML += `</tbody></table>`;
                }
            }
            relatorioHTML += `</div>`; // Fecha a div do bloco diário
        }

tempDiv.innerHTML = relatorioHTML;
        
        // CORREÇÃO 1: Limpa qualquer tabela de impressão anterior presa na memória
        const tabelaAntiga = document.getElementById('tabela-impressao-temp');
        if (tabelaAntiga) {
            document.body.removeChild(tabelaAntiga);
        }

        document.body.appendChild(tempDiv);
        
        window.print();
        
        // CORREÇÃO 2: Aumentamos o tempo de meio segundo (500) para 2 minutos (120000).
        // Isso dá tempo de sobra para o Android gerar o PDF e salvar na pasta sem pressa!
        setTimeout(() => {
            const tabelaAtual = document.getElementById('tabela-impressao-temp');
            if (tabelaAtual) {
                document.body.removeChild(tabelaAtual);
            }
        }, 120000); 
        
        dom.presencaStatus.textContent = "✅ Impressão solicitada com sucesso. Salve o PDF!";
    };


    const scrollToTop = () => {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    };

    dom.settingWhatsapp.value = state.whatsappNumber;
    
    dom.toggleSettingsBtn.addEventListener('click', () => {
        const panel = dom.settingsPanel;
        if (panel.style.display === 'none') {
            panel.style.display = 'block';
        } else {
            panel.style.display = 'none';
        }
    });

    dom.saveSettingsBtn.addEventListener('click', saveSettings);            
    
    dom.settingColegio.addEventListener('change', () => {
        popularTurmas(dom.settingColegio, dom.settingTurma);
        dom.settingHorario.value = '';
    });
    
    dom.settingTurma.addEventListener('change', () => {
        const horarioSalvo = loadHorario(dom.settingColegio.value, dom.settingTurma.value);
        dom.settingHorario.value = horarioSalvo;
    });

    dom.settingSaveHorarioBtn.addEventListener('click', () => {
        saveHorario(dom.settingColegio.value, dom.settingTurma.value, dom.settingHorario.value);     
    });
    
    dom.presencaColegio.addEventListener('change', () => {
        popularTurmas(dom.presencaColegio, dom.presencaTurma);
        dom.listaAlunos.innerHTML = `<tr><td colspan="5" style="text-align: center;">Selecione uma Turma para carregar a lista de alunos.</td></tr>`;
        dom.presencaHorario.value = '';
    });
    
    dom.presencaTurma.addEventListener('change', () => {
        const colegio = dom.presencaColegio.value;
        const turma = dom.presencaTurma.value;
        if (colegio && turma) {
            dom.presencaHorario.value = loadHorario(colegio, turma);
            carregarAlunos(colegio, turma);
        } else {
             dom.listaAlunos.innerHTML = `<tr><td colspan="5" style="text-align: center;">Selecione uma Turma para carregar a lista de alunos.</td></tr>`;
             dom.presencaHorario.value = '';
        }
    });

    dom.formPresenca.addEventListener('submit', gerarRelatorioPresenca); 
    dom.saveFaltasBtn.addEventListener('click', apenasSalvarFaltas);
    dom.savePdfBtn.addEventListener('click', imprimirRelatorioGeral); 
    dom.sendFullReportBtn.addEventListener('click', () => { enviarRelatorioGeral(false); });
    dom.clearFullReportBtn.addEventListener('click', limparRelatorioGeral);
    dom.scrollToTopBtn.addEventListener('click', scrollToTop);

    popularTurmas(dom.presencaColegio, dom.presencaTurma);

    const campoData = dom.presencaData;
    if (campoData) {
        const hoje = new Date();
        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
        const dia = String(hoje.getDate()).padStart(2, '0');
        campoData.value = `${ano}-${mes}-${dia}`;
    }

});
</script>

</body>
</html>
